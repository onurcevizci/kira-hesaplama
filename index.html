<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Cevizci Home Kira Döviz Hesaplayıcı</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      color: white;
      transition: background 0.3s, color 0.3s;
    }

    body.light-theme {
      background: #f3f4f6;
      color: #111827;
    }
    body.light-theme .container, body.light-theme .log-box {
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      border: 1px solid rgba(0,0,0,0.1);
      color: #111827;
    }
    body.light-theme input, body.light-theme .result {
      background: rgba(0,0,0,0.05);
      color: #111827;
    }
    body.light-theme input::placeholder { color: rgba(0,0,0,0.5); }
    body.light-theme .mini-btn { background: rgba(0,0,0,0.1); color: #111827; }

    .container {
      width: 100%;
      max-width: 450px;
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    h1 { text-align: center; margin-bottom: 5px; font-size: 26px; }
    .subtitle { text-align: center; opacity: 0.7; margin-bottom: 25px; font-size: 14px; }
    label { display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px; font-weight: bold; }
    
    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.12);
      color: inherit;
      font-size: 16px;
      outline: none;
    }

    .topbar { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 15px; }
    .mini-btn {
      flex: 1; padding: 10px; font-size: 13px; border-radius: 12px;
      background: rgba(255,255,255,0.1); border: none; color: inherit;
      cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .mini-btn:hover { background: rgba(128,128,128,0.3); }

    .btn-main, .btn-save {
      width: 100%; margin-top: 15px; padding: 14px; border-radius: 12px;
      border: none; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
    }
    .btn-main { background: #2563eb; }
    .btn-main:hover { background: #1d4ed8; }
    .btn-save { background: #10b981; }
    .btn-save:hover { background: #059669; }

    .result {
      margin-top: 20px; background: rgba(255,255,255,0.08); padding: 15px;
      border-radius: 15px; line-height: 1.8;
    }
    .highlight { color: #22c55e; font-weight: bold; font-size: 20px; }

    .log-box {
      width: 100%; max-width: 450px; background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px); border-radius: 25px; padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .log-item {
      border-bottom: 1px solid rgba(128,128,128,0.2);
      padding: 10px 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center;
    }
    .log-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <button class="mini-btn" id="btn-tema">🌙 Tema</button>
    <button class="mini-btn" id="btn-kur">💱 Canlı Kur</button>
    <button class="mini-btn" id="btn-bg-trigger">🖼️ Arka Plan</button>
    <input type="file" id="bgInput" accept="image/*" style="display:none">
  </div>

  <h1>Cevizci Home Döviz</h1>
  <div class="subtitle">USD / STG / TL Hesap Sistemi</div>

  <label>Dolar Kuru (TL)</label>
  <input type="number" id="usd" step="0.01" value="0.00">

  <label>STG Kuru (TL)</label>
  <input type="number" id="stg" step="0.01" value="0.00">

  <label>Kira (STG)</label>
  <input type="number" id="rent" value="450">

  <label>TL Olarak Verilen</label>
  <input type="number" id="paidTl" value="15000">

  <button class="btn-main" id="btn-hesapla">Hesapla</button>

  <div class="result" id="result">
    Lütfen kurları getirip "Hesapla" butonuna basın.
  </div>

  <button class="btn-save" id="btn-kaydet">💾 Ödemeyi Kaydet</button>
</div>

<div class="log-box">
  <h3 style="text-align: center; margin-bottom: 15px;">Ödeme Geçmişi (Logs)</h3>
  <div id="log-list">Bağlantı kuruluyor...</div>
</div>

<script type="module">
  // Firebase Kütüphaneleri (Realtime Database İçin)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
  import { getDatabase, ref, push, set, get } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-database.js";

  // Yeni Firebase Bilgileriniz
  const firebaseConfig = {
    apiKey: "AIzaSyAY5bL4X7zghumCDsIbHCetgSdUUqEwhAM",
    authDomain: "live-current.firebaseapp.com",
    databaseURL: "https://live-current-default-rtdb.firebaseio.com",
    projectId: "live-current",
    storageBucket: "live-current.firebasestorage.app",
    messagingSenderId: "1027844765042",
    appId: "1:1027844765042:web:4136321812d41ea2eb19eb"
  };

  let db;
  let remainingUsdGlobal = 0;

  try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      loglariCek();
  } catch (error) {
      document.getElementById('log-list').innerHTML = `<span style="color:red">Firebase başlatılamadı: ${error.message}</span>`;
  }

  // --- HESAPLAMA FONKSİYONU ---
  function hesapla() {
    const usd = parseFloat(document.getElementById('usd').value) || 0;
    const stg = parseFloat(document.getElementById('stg').value) || 0;
    const rent = parseFloat(document.getElementById('rent').value) || 0;
    const paidTl = parseFloat(document.getElementById('paidTl').value) || 0;

    if (usd === 0 || stg === 0) {
        alert("Lütfen kurları girin veya 'Canlı Kur' butonuna basın.");
        return;
    }

    const totalTl = rent * stg;
    const remainingTl = totalTl - paidTl;
    remainingUsdGlobal = remainingTl / usd;

    document.getElementById('result').innerHTML = `
      <div style="display:flex; justify-content:space-between;"><span>🏠 Toplam Kira (TL):</span> <strong>${totalTl.toFixed(2)} ₺</strong></div>
      <div style="display:flex; justify-content:space-between; margin-top:8px;"><span>💸 Kalan Borç (TL):</span> <strong>${remainingTl.toFixed(2)} ₺</strong></div>
      <div style="display:flex; justify-content:space-between; margin-top:15px; font-size:18px;"><span>💵 Ödenecek USD:</span> <span class="highlight">${remainingUsdGlobal.toFixed(2)} $</span></div>
    `;
  }

  // --- CANLI KUR ÇEKME FONKSİYONU ---
  async function kurGetir() {
    const btn = document.getElementById('btn-kur');
    btn.innerText = "⏳ Bekleyin...";
    try {
      const resUsd = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
      const dataUsd = await resUsd.json();
      const currentUsdToTl = dataUsd.usd.try;

      const resGbp = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/gbp.json');
      const dataGbp = await resGbp.json();
      const currentGbpToTl = dataGbp.gbp.try;

      document.getElementById('usd').value = currentUsdToTl.toFixed(2);
      document.getElementById('stg').value = currentGbpToTl.toFixed(2);

      hesapla();
      btn.innerText = "💱 Canlı Kur";
    } catch (e) {
      alert('Kur alınamadı! Tarayıcınız veya ağınız engelliyor olabilir.');
      btn.innerText = "💱 Canlı Kur";
    }
  }

  // --- FİREBASE (REALTIME DB) KAYDETME FONKSİYONU ---
  async function firebaseKaydet() {
    if (!db) {
      alert("Veritabanı bağlantısı yok!");
      return;
    }
    if (remainingUsdGlobal <= 0) {
      alert("Önce hesaplama yapın veya kurları güncelleyin!");
      return;
    }

    const btn = document.getElementById('btn-kaydet');
    btn.innerText = "⏳ Kaydediliyor...";

    const tarihStr = new Date().toLocaleString('tr-TR');
    
    const logData = {
      tarih: tarihStr,
      timestamp: Date.now(),
      kira_stg: document.getElementById('rent').value,
      verilen_tl: document.getElementById('paidTl').value,
      kur_usd: document.getElementById('usd').value,
      kur_stg: document.getElementById('stg').value,
      odenen_dolar: remainingUsdGlobal.toFixed(2)
    };

    try {
      const yeniKayitRef = push(ref(db, 'kiraLoglari'));
      await set(yeniKayitRef, logData);
      alert("✅ Ödeme başarıyla Realtime Database'e kaydedildi!");
      loglariCek(); 
    } catch (error) {
      console.error("Firebase Hatası:", error);
      alert("HATA! Kayıt başarısız oldu. Firebase 'Realtime Database -> Rules' ayarlarınızı kontrol edin.");
    } finally {
      btn.innerText = "💾 Ödemeyi Kaydet";
    }
  }

  // --- FİREBASE (REALTIME DB) LOGLARI ÇEKME FONKSİYONU ---
  async function loglariCek() {
    if (!db) return;
    
    const logList = document.getElementById('log-list');
    
    try {
      const snapshot = await get(ref(db, 'kiraLoglari'));
      logList.innerHTML = ''; 
      
      if(!snapshot.exists()) {
        logList.innerHTML = "Henüz kayıtlı ödeme yok.";
        return;
      }

      const veriler = snapshot.val();
      
      // Verileri array'e çevirip tarihe göre yeniden eskiye sıralama
      const veriDizisi = Object.values(veriler).sort((a, b) => b.timestamp - a.timestamp);

      veriDizisi.forEach((data) => {
        logList.innerHTML += `
          <div class="log-item">
            <div>
              <strong>${data.tarih}</strong><br>
              <span style="font-size:11px; opacity:0.7;">1$ = ${data.kur_usd}₺ | 1£ = ${data.kur_stg}₺</span>
            </div>
            <div style="color:#22c55e; font-weight:bold; font-size:16px;">
              ${data.odenen_dolar} $
            </div>
          </div>
        `;
      });
    } catch (e) {
      console.error(e);
      logList.innerHTML = `<span style="color:#ef4444; font-size:13px;">Kayıtlar çekilemedi. 'Realtime Database' Kurallarını kontrol edin.</span>`;
    }
  }

  // --- EVENT LISTENERS ---
  document.getElementById('btn-hesapla').addEventListener('click', hesapla);
  document.getElementById('btn-kur').addEventListener('click', kurGetir);
  document.getElementById('btn-kaydet').addEventListener('click', firebaseKaydet);
  
  document.getElementById('btn-tema').addEventListener('click', () => {
    document.body.classList.toggle('light-theme');
  });

  document.getElementById('btn-bg-trigger').addEventListener('click', () => {
    document.getElementById('bgInput').click();
  });

  document.getElementById('bgInput').addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.body.style.backgroundImage = `url('${e.target.result}')`;
      }
      reader.readAsDataURL(file);
    }
  });

</script>

</body>
</html>
